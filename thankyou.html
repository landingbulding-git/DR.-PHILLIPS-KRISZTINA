<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Köszönjük - Dr. Phillips Krisztina</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;500;700&family=Nunito+Sans:opsz,wght@6..12,300;400;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Nunito Sans"', 'sans-serif'],
              display: ['"DM Sans"', 'sans-serif'],
            },
            colors: {
              brand: {
                black: '#1a1a1a',
                dark: '#333333',
                gold: '#c5a059',
                green: '#2d8a5e',
                gray: '#f5f5f5',
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-brand-gray">
    <div class="flex flex-col min-h-screen">
        <header class="bg-white shadow-sm sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-center h-20 items-center">
                    <div class="flex flex-col items-center">
                        <span class="font-display font-bold text-2xl tracking-wider text-brand-black">DR. PHILLIPS</span>
                        <span class="text-[10px] tracking-widest text-brand-gold uppercase">Esztétikai Bőrgyógyászat</span>
                    </div>
                </div>
            </div>
        </header>
        <main class="flex-grow flex items-center justify-center p-4">
            <div class="bg-white p-8 md:p-12 rounded-xl shadow-2xl max-w-lg text-center border-t-8 border-brand-gold">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-brand-green"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                </div>
                <h1 class="font-display text-3xl md:text-4xl font-bold text-brand-black mb-4">
                    Köszönjük a bizalmát!
                </h1>
                <p class="text-lg text-gray-600 mb-8 leading-relaxed">
                    Megkeresését sikeresen rögzítettük. Munkatársunk hamarosan keresni fogja Önt a megadott elérhetőségeken az időpont egyeztetése céljából.
                </p>
                <div class="border-t border-gray-100 pt-6">
                    <p class="font-bold text-brand-gold uppercase tracking-wider text-sm">Dr. Phillips Krisztina és csapata</p>
                </div>
            </div>
        </main>
        <footer class="bg-brand-dark text-gray-400 py-12 border-t border-gray-800">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="text-center text-sm">
                    <p>&copy; 2024 Dr. Phillips Krisztina. Minden jog fenntartva.</p>
                </div>
            </div>
        </footer>
    </div>
</body>
</html>
